name: Release Packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Target Release Tag (e.g. v2.0, or leave empty for latest)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install 7-Zip for Maximum Compression
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full

      - name: Determine tag name
        id: vars
        run: |
          INPUT_TAG="${{ github.event.inputs.tag_name }}"
          EVENT_TAG="${{ github.event.release.tag_name }}"

          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          elif [ -n "${EVENT_TAG}" ]; then
            TAG="${EVENT_TAG}"
          else
            TAG=$(git describe --tags --abbrev=0 2>/dev/null || git describe --tags --always)
          fi

          echo "TAG=${TAG}" >> $GITHUB_ENV
          echo "Selected package tag: ${TAG}"

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Windows Executable (Self-Contained)
        run: |
          dotnet publish src/LotroTtsGui/LotroTtsGui.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o pub_win

      - name: Build Linux Executable (Self-Contained)
        run: |
          dotnet publish src/LotroTtsGui/LotroTtsGui.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -o pub_linux

      - name: Package Windows Zip (x64)
        run: |
          mkdir -p dist/win_staging
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.vscode' \
                    --exclude='*.pyc' \
                    --exclude='__pycache__' \
                    --exclude='LOTRO-TTS' \
                    --exclude='LOTRO-TTS.exe' \
                    --exclude='src/quests' \
                    --exclude='src/LotroTtsGui/bin' \
                    --exclude='src/LotroTtsGui/obj' \
                    --exclude='pub_win' \
                    --exclude='pub_linux' \
                    --exclude='dist' \
                    --exclude='_update_temp' \
                    ./ dist/win_staging/

          # Copy freshly compiled self-contained Windows executable into package root
          cp pub_win/LOTRO-TTS.exe dist/win_staging/LOTRO-TTS.exe

          cd dist/win_staging
          7z a -tzip -mx=9 -mfb=258 -mpass=15 "../../dist/LOTRO-TTS-${TAG}-Windows-x64.zip" .
          cd ../..

      - name: Package Linux Zip (x64)
        run: |
          mkdir -p dist/linux_staging
          rsync -av --exclude='.git' \
                    --exclude='.github' \
                    --exclude='.vscode' \
                    --exclude='*.pyc' \
                    --exclude='__pycache__' \
                    --exclude='LOTRO-TTS' \
                    --exclude='LOTRO-TTS.exe' \
                    --exclude='python/win64' \
                    --exclude='src/quests' \
                    --exclude='src/LotroTtsGui/bin' \
                    --exclude='src/LotroTtsGui/obj' \
                    --exclude='pub_win' \
                    --exclude='pub_linux' \
                    --exclude='dist' \
                    --exclude='_update_temp' \
                    ./ dist/linux_staging/

          # Copy freshly compiled self-contained Linux executable into package root
          cp pub_linux/LOTRO-TTS dist/linux_staging/LOTRO-TTS

          # Ensure execution permissions for Linux executable and scripts
          chmod +x dist/linux_staging/LOTRO-TTS
          find dist/linux_staging -name "*.sh" -exec chmod +x {} + 2>/dev/null || true

          cd dist/linux_staging
          7z a -tzip -mx=9 -mfb=258 -mpass=15 "../../dist/LOTRO-TTS-${TAG}-Linux-x64.zip" .
          cd ../..

      - name: Upload Workflow Artifacts (Action Summary)
        uses: actions/upload-artifact@v4
        with:
          name: LOTRO-TTS-${{ env.TAG }}-Packages
          path: dist/*.zip
          retention-days: 7

      - name: Attach Assets to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking release for tag: ${TAG}..."
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release '${TAG}' found. Uploading release assets..."
            gh release upload "${TAG}" \
              dist/LOTRO-TTS-${TAG}-Windows-x64.zip \
              dist/LOTRO-TTS-${TAG}-Linux-x64.zip \
              --clobber
          else
            echo "Release '${TAG}' does not exist on GitHub yet. Creating release '${TAG}'..."
            gh release create "${TAG}" \
              dist/LOTRO-TTS-${TAG}-Windows-x64.zip \
              dist/LOTRO-TTS-${TAG}-Linux-x64.zip \
              --title "LOTRO-TTS ${TAG}" \
              --notes "Automated release packages for ${TAG}."
          fi
